[workspace]
resolver = "2"
members = ["crates/lar", "crates/lar-package", "crates/lar-store"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Linux Application Runtime — side-by-side packages and resolved application runtimes"
repository = "https://github.com/lar-linux/lar"
rust-version = "1.80"

[workspace.dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
lar-package = { path = "crates/lar-package" }
lar-store = { path = "crates/lar-store" }
semver = "1.0"
serde = "1.0"
serde_json = "1.0"
tar = "0.4"
tempfile = "3.14"
thiserror = "2.0"
toml = "0.8"
zstd = "0.13"
