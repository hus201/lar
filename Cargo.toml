[workspace]
resolver = "2"
members = [
    "crates/lar",
    "crates/lar-exec",
    "crates/lar-package",
    "crates/lar-store",
    "crates/lar-resolver",
    "crates/lar-runtime",
    "crates/lar-trampoline",
    "crates/lar-manager",
    "crates/lar-repo",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
description = "Linux Application Runtime — side-by-side packages and resolved application runtimes"
repository = "https://github.com/hus201/lar"
rust-version = "1.80"

[workspace.dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
lar-package = { path = "crates/lar-package" }
lar-resolver = { path = "crates/lar-resolver" }
lar-runtime = { path = "crates/lar-runtime" }
lar-trampoline = { path = "crates/lar-trampoline" }
lar-manager = { path = "crates/lar-manager" }
lar-repo = { path = "crates/lar-repo" }
lar-store = { path = "crates/lar-store" }
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2.5"
semver = "1.0"
serde = "1.0"
serde_json = "1.0"
tar = "0.4"
tempfile = "3.14"
thiserror = "2.0"
toml = "0.8"
zstd = "0.13"
